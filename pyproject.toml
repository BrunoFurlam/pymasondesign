[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymasondesign"
version = "0.1.0"
description = "Core library for structural masonry design according to ABNT NBR 16868"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Masonry Design Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pymasondesign"]
